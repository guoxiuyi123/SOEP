# RT-DETR ResNet18 baseline with SOEP inserted after P3 and P4 stages.

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 4
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 5-P3/8
  - [-1, 1, SOEP, []] # 6 (P3 enhanced)
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 7-P4/16
  - [-1, 1, SOEP, []] # 8 (P4 enhanced)
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 9-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 10 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 11
  - [-1, 1, Conv, [256, 1, 1]]  # 12, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [8, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 14 input_proj.1 (P4 enhanced)
  - [[-2, -1], 1, Concat, [1]] # 15
  - [-1, 3, RepC3, [256, 0.5]]  # 16, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]   # 17, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 18
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 19 input_proj.0 (P3 enhanced)
  - [[-2, -1], 1, Concat, [1]]  # 20 cat backbone P3
  - [-1, 3, RepC3, [256, 0.5]]    # 21, fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]]   # 22, downsample_convs.0
  - [[-1, 17], 1, Concat, [1]]  # 23 cat Y4
  - [-1, 3, RepC3, [256, 0.5]]    # 24, pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]]   # 25, downsample_convs.1
  - [[-1, 12], 1, Concat, [1]]  # 26 cat Y5
  - [-1, 3, RepC3, [256, 0.5]]    # 27, pan_blocks.1

  - [[21, 24, 27], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]

